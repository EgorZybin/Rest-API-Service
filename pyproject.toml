[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-api"
version = "0.1.0"
description = "REST API wrapper over the Sherlock Telegram bot (account pool + dispatcher)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Egor" }]
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Telegram
    "telethon>=1.36",
    # python-socks is Telethon's async-aware proxy backend; PySocks is kept as a
    # fallback and to expose its constants (socks.SOCKS5 etc.) in our mapper.
    "python-socks[asyncio]>=2.5",
    "pysocks>=1.7",

    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",

    # Observability
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",

    # Utils
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "tenacity>=9.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "types-requests",
]

[project.scripts]
sherlock-api = "sherlock_api.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
    "E501",
    "RUF001",
    "RUF022",
    "RUF059",
    "RUF100",
    "ASYNC109",
    "ASYNC240",
    "SIM105",
    "UP012",
    "UP017",
    "UP035",
    "UP037",
    "UP041",
    "UP042",
]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
